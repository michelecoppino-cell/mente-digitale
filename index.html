<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mente Digitale</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mente" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0e1013" />

    <!-- I caratteri, chiesti da qui e non da un `@import` in cima a index.css.
         Un `@import` dentro un CSS il browser lo scopre solo dopo aver
         scaricato e letto quel CSS: sono due viaggi in fila sul percorso
         critico, e su rete mobile il testo resta senza il suo carattere per
         tutto il secondo. Qui la richiesta parte mentre l'HTML si sta ancora
         leggendo, e il preconnect apre in anticipo la connessione al dominio
         da cui arrivano i file veri (gstatic). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- L'icona della scheda era `/icons.svg`: uno sprite di `<symbol>` di
         loghi social rimasto da un boilerplate, che come favicon disegna il
         vuoto. Adesso è il marchio dell'app, lo stesso di icon-192.png. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
