<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mente Digitale</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mente" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0e1013" />

    <!-- L'icona della scheda era `/icons.svg`, che non è l'icona dell'app: è un
         foglio di <symbol> (icone social) rimasto dal modello di partenza, senza
         un viewBox alla radice, quindi non disegnabile — la scheda mostrava il
         segnaposto vuoto del browser. Questa è l'icona vera, la stessa della
         schermata Home. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- I caratteri stanno qui e non in un @import dentro index.css: dentro il
         CSS il browser li scopre solo dopo aver scaricato e analizzato l'intero
         foglio dell'app (oltre cento kilobyte), cioè una richiesta in fila
         invece che in parallelo, e il titolo restava in Georgia per il primo
         mezzo secondo. Con il preconnect la connessione a Google Fonts è già
         aperta quando serve. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
