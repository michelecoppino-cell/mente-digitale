<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Mente Digitale">
  <title>Mente Digitale</title>
  <!-- Il marchio dell'app: la M dentro la costellazione, gli stessi due colori
       dei token (fondo #0e1013, ocra #d4a44a). È il disegno di icon-192.png,
       ridisegnato come vettore perché la scheda del browser possa mostrarlo a
       qualunque misura senza sfocare. -->
  <rect width="192" height="192" rx="34" fill="#0e1013"/>
  <g fill="none" stroke="#d4a44a" stroke-linecap="round">
    <!-- L'anello tratteggiato -->
    <circle cx="96" cy="96" r="70" stroke-width="1.6" stroke-dasharray="4 7" opacity=".38"/>
    <!-- I raggi che dalla M vanno alle stelle -->
    <g stroke-width="1.4" opacity=".55">
      <path d="M96 78V34"/>
      <path d="M74 88 26 66"/>
      <path d="M118 88 158 54"/>
      <path d="M74 108 34 130"/>
      <path d="M118 108 162 122"/>
      <path d="M96 118 86 162"/>
    </g>
  </g>
  <!-- Le stelle -->
  <g fill="#d4a44a">
    <circle cx="96" cy="30" r="5.5"/>
    <circle cx="22" cy="64" r="6"/>
    <circle cx="162" cy="50" r="5"/>
    <circle cx="30" cy="134" r="5"/>
    <circle cx="166" cy="126" r="6"/>
    <circle cx="84" cy="166" r="5.5"/>
  </g>
  <!-- La M -->
  <path d="M62 126V70h11l23 33 23-33h11v56h-12V90l-19 27h-6L74 90v36z" fill="#c9a05a"/>
</svg>
